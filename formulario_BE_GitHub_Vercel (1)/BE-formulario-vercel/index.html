<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sua experiência na BE</title>
<style>
:root{--bg:#0b0b0c;--ink:#f3f3f1;--mute:#a4a4a6;--glass:rgba(255,255,255,.06);--glass2:rgba(255,255,255,.1);--line:rgba(255,255,255,.14);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:"Helvetica Neue",Arial,sans-serif;font-weight:400;font-synthesis:none;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(55% 38% at 50% -4%,rgba(255,255,255,.14),transparent 70%),radial-gradient(42% 40% at 92% 88%,rgba(190,200,215,.11),transparent 70%),repeating-radial-gradient(ellipse 130% 90% at 50% 125%,rgba(255,255,255,.055) 0 1.5px,transparent 1.5px 54px)}
header{position:relative;z-index:1;display:flex;justify-content:center;padding:30px 20px 0}
header img{height:88px;width:auto}
main{position:relative;z-index:1;flex:1;display:flex;align-items:center;justify-content:center;padding:26px 20px 48px}
.panel{width:100%;max-width:760px;background:var(--glass);backdrop-filter:blur(24px) saturate(140%);-webkit-backdrop-filter:blur(24px) saturate(140%);border:1px solid var(--line);border-radius:28px;padding:clamp(24px,5vw,48px);box-shadow:0 30px 80px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08)}
h1,h2{margin:0;font-weight:400;letter-spacing:-.02em;line-height:1.05}
h1{font-size:clamp(40px,7.5vw,68px)}
h2{font-size:clamp(27px,4.6vw,40px);max-width:24em}
.lead{color:var(--mute);font-size:clamp(16px,2.2vw,19px);line-height:1.55;max-width:34em;margin:18px 0 0}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin:28px 0 32px}
.chip{border:1px solid var(--line);border-radius:999px;padding:9px 18px;font-size:14px;background:rgba(255,255,255,.04)}
.btn{font:inherit;font-size:16px;cursor:pointer;border-radius:14px;padding:16px 30px;border:1px solid var(--line);color:var(--ink);background:transparent;transition:background .25s,color .25s,border-color .25s}
.btn.ghost:hover{background:var(--glass2)}
.btn.main{background:var(--ink);color:#0b0b0c;border-color:var(--ink)}
.btn.main:disabled{background:rgba(255,255,255,.07);color:var(--mute);border-color:var(--line);cursor:not-allowed}
.count{display:flex;align-items:baseline;gap:10px;color:var(--mute);font-size:14px;margin-bottom:14px}
.count b{font-weight:400;color:var(--ink);font-size:36px;letter-spacing:-.02em}
.bar{height:3px;background:rgba(255,255,255,.1);border-radius:3px;margin-bottom:32px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:3px;transition:width .6s ease}
.note{color:var(--mute);font-size:16px;line-height:1.5;margin:14px 0 26px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:16px;text-align:left;font:inherit;font-size:clamp(15px,2vw,17px);line-height:1.35;color:var(--ink);background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:16px;padding:15px 18px;cursor:pointer;transition:background .25s,border-color .25s}
.opt:hover{background:var(--glass2)}
.opt[aria-pressed=true]{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.55)}
.k{flex:none;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;font-size:13px;transition:background .25s,color .25s}
.opt[aria-pressed=true] .k{background:var(--ink);color:#0b0b0c;border-color:var(--ink)}
textarea{width:100%;min-height:170px;resize:vertical;font:inherit;font-size:17px;line-height:1.5;color:var(--ink);background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:16px;padding:18px}
textarea::placeholder{color:#7d7d80}
.foot{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:28px;flex-wrap:wrap}
.r{display:flex;align-items:center;gap:18px}
.hint{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:13px}
.hint::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--mute)}
:focus-visible{outline:2px solid #fff;outline-offset:3px}
.fade{animation:in .5s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:560px){.foot,.r{flex-direction:column-reverse;align-items:stretch}.r{gap:12px}.hint{justify-content:center}.btn{width:100%}header img{height:72px}}
.panel{background:transparent;border:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;max-width:760px;padding:clamp(8px,2vw,24px)}
main{align-items:flex-start;padding:clamp(24px,5vh,56px) 20px 56px}
.count{font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:14px}
.count b{font-size:30px;letter-spacing:-.02em}
.bar{margin-bottom:clamp(32px,6vh,56px)}
h1,h2{font-weight:700}
h2{font-size:clamp(24px,3.6vw,38px);line-height:1.18;letter-spacing:0;text-transform:uppercase;max-width:none}
.note{font-size:15px;line-height:1.6;margin:18px 0 clamp(28px,5vh,44px)}
.opts{grid-template-columns:1fr;gap:14px}
.opt{padding:18px 20px;min-height:68px;font-size:clamp(15px,1.8vw,17px);line-height:1.4;gap:18px;border-radius:16px}
.k{width:34px;height:34px;border-radius:10px;font-size:13px}
textarea{min-height:180px;font-size:16px;padding:18px}
.foot{margin-top:clamp(32px,6vh,48px)}
.btn{padding:15px 28px;font-size:15px;border-radius:14px}
.hint{font-size:13px}
.panel:has(h1){text-align:center;padding-top:clamp(8px,4vh,40px)}
.panel h1{font-size:clamp(34px,6.2vw,62px);line-height:1.08;letter-spacing:-.025em;max-width:13em;margin:0 auto}
.panel h1 em,.it{font-style:italic;font-weight:400;color:#c4c4c7}
.badge{display:inline-flex;align-items:center;gap:9px;background:var(--ink);color:#0b0b0c;border-radius:999px;padding:11px 22px;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-bottom:30px}
.badge i{width:7px;height:7px;border-radius:50%;background:#0b0b0c}
.panel .lead{margin:28px auto 0;max-width:30em}
.chips{justify-content:center;gap:12px;margin:36px 0 36px}
.chip{display:inline-flex;align-items:center;gap:10px;padding:10px 20px 10px 12px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:transparent}
.chip svg{width:26px;height:26px;flex:none}
.panel:has(h1) .btn.main{padding:18px 40px;font-size:14px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
@media(max-width:620px){main{padding:20px 14px 40px}.panel{padding:4px}.opt{padding:15px 14px;min-height:60px;font-size:15px}.chips{gap:8px}}
</style></head>

const pad=n=>String(n).padStart(2,"0");
const p=document.getElementById("p");
function show(h){p.innerHTML=h;p.classList.remove("fade");void p.offsetWidth;p.classList.add("fade");window.scrollTo({top:0})}
function render(){
 if(i<0)return show(`<span class="badge"><i></i>Pesquisa exclusiva</span><h1>Conte como é <em>viver a BE</em> e ajude a cuidar <em>ainda melhor</em> de você.</h1><p class="lead">Para a BE, morar bem é um estilo de vida, e cuidar de pessoas é o centro de tudo o que fazemos. Conte como tem sido a sua experiência: cada resposta é muito bem-vinda.</p><div class="chips"><span class="chip"><svg viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="13" fill="#f3f3f1"/><text x="13" y="18.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0b0b0c" font-family="Arial,sans-serif">?</text></svg>6 perguntas</span><span class="chip"><svg viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="13" fill="#f3f3f1"/><circle cx="13" cy="13" r="8" fill="none" stroke="#0b0b0c" stroke-width="2"/><path d="M13 8.5V13l3 2" fill="none" stroke="#0b0b0c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>2 minutos</span></div><button class="btn main" id="go">Começar</button>`),document.getElementById("go").onclick=()=>{i=0;render()};
 if(i>=Q.length)return show(`<h1>Obrigado por estar com a BE.</h1><p class="lead">A sua participação é muito importante e vai nos ajudar a cuidar ainda melhor de você. Que a sua moradia seja sempre um lugar de bem-estar.</p>`);
 const q=Q[i],last=i===Q.length-1;
 const body=q.open?`<textarea id="ta" placeholder="O que você sentiu, o que poderia ser melhor, o que gostaria de ver na BE…" aria-label="Sua mensagem"></textarea>`:`<div class="opts">${q.o.map((o,k)=>`<button class="opt" data-k="${k}" aria-pressed="false"><span class="k">${L[k]}</span><span>${o}</span></button>`).join("")}</div>`;
 show(`<div class="count">Pergunta <b>${pad(i+1)}</b> / ${pad(Q.length)}</div><div class="bar"><i style="width:${i/Q.length*100}%"></i></div><h2>${q.t}</h2><p class="note">${q.n}</p>${body}<div class="foot"><button class="btn ghost" id="bk">Voltar</button><div class="r"><span class="hint" id="ht"></span><button class="btn main" id="nx"></button></div></div>`);
 requestAnimationFrame(()=>{const b=p.querySelector(".bar i");if(b)b.style.width=(i+1)/Q.length*100+"%"});
 document.getElementById("bk").onclick=()=>{i--;render()};
 const nx=document.getElementById("nx"),ht=document.getElementById("ht");
 nx.textContent=last?"Enviar respostas":"Avançar";
 function sync(){
  p.querySelectorAll(".opt").forEach(b=>b.setAttribute("aria-pressed",(A[i]||[]).includes(+b.dataset.k)));
  const ok=q.open||(A[i]||[]).length>0;nx.disabled=!ok;
  ht.textContent=q.open?"Opcional, mas muito bem-vinda":ok?"Tudo certo, pode seguir":q.m?"Selecione uma ou mais opções para seguir":"Selecione uma opção para seguir";
 }
 if(q.open){const ta=document.getElementById("ta");ta.value=txt;ta.oninput=()=>txt=ta.value}
 p.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const k=+b.dataset.k,a=A[i]||[];A[i]=q.m?(a.includes(k)?a.filter(x=>x!==k):[...a,k]):[k];sync()});
 nx.onclick=()=>last?send():(i++,render());
 sync();
}
async function send(){
 const nx=document.getElementById("nx");
 const originalText=nx.textContent;
 nx.disabled=true;
 nx.textContent="Enviando…";
 const d={
   em:new Date().toISOString(),
   respostas:Q.filter(q=>!q.open).map((q,k)=>({
     pergunta:q.t,
     escolhas:(A[k]||[]).map(x=>q.o[x])
   })),
   mensagem:txt.trim()
 };
 if(!GOOGLE_APPS_SCRIPT_URL || !GOOGLE_APPS_SCRIPT_URL.endsWith("/exec")){
   nx.disabled=false;
   nx.textContent=originalText;
   let aviso=document.getElementById("send-error");
   if(!aviso){
     aviso=document.createElement("p");
     aviso.id="send-error";
     aviso.setAttribute("role","alert");
     aviso.style.cssText="color:#b42318;font-size:14px;margin-top:14px;line-height:1.5";
     nx.closest(".r").appendChild(aviso);
   }
   aviso.textContent="A URL do Apps Script não foi configurada corretamente.";
   return;
 }
 try{
   const form = document.createElement('form');
   form.method = 'POST';
   form.action = GOOGLE_APPS_SCRIPT_URL;
   form.target = 'hidden_iframe';

   const input = document.createElement('input');
   input.type = 'hidden';
   input.name = 'payload';
   input.value = JSON.stringify(d);
   form.appendChild(input);

   let iframe = document.getElementById('hidden_iframe');
   if (!iframe) {
     iframe = document.createElement('iframe');
     iframe.name = 'hidden_iframe';
     iframe.id = 'hidden_iframe';
     iframe.style.display = 'none';
     document.body.appendChild(iframe);
   }

   document.body.appendChild(form);
   form.submit();
   document.body.removeChild(form);

   setTimeout(()=>{
     i=Q.length;
     render();
   }, 800);
 }catch(e){
   nx.disabled=false;
   nx.textContent=originalText;
   let aviso=document.getElementById("send-error");
   if(!aviso){
     aviso=document.createElement("p");
     aviso.id="send-error";
     aviso.setAttribute("role","alert");
     aviso.style.cssText="color:#b42318;font-size:14px;margin-top:14px;line-height:1.5";
     nx.closest(".r").appendChild(aviso);
   }
   aviso.textContent="Não foi possível iniciar o envio. Verifique sua conexão e tente novamente.";
 }
}
render();
</script></body></html>
